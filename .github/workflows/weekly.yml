name: weekly-brief

on:
  schedule:
    # GitHub 的定时器不准时（整点最容易堵），所以错开整点、多排几次补跑。
    # 生成脚本带 --skip-if-done：同一周只生成一次，多触发几次不会重复花钱。
    - cron: "30 13 * * 5" # 周五 21:30 北京时间
    - cron: "43 14 * * 5" # 周五 22:43 补跑
    - cron: "17 2 * * 6" # 周六 10:17 再补一次
  push:
    paths:
      - "site/**"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成周报
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BARK_URL: ${{ secrets.BARK_URL }}
          PAGE_URL: ${{ vars.PAGE_URL }}
        run: python3 run.py --no-open --skip-if-done

      - name: 归档本期到仓库（保留历史）
        run: |
          git config user.name "weekly-brief-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: 周报 $(date -u +%G-W%V)"
            # 定时任务下 HEAD 可能是游离状态，显式推到 main；失败则先 rebase 再试一次
            git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
